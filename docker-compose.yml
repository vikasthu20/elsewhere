services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: elsewhere
      POSTGRES_USER: elsewhere
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elsewhere -d elsewhere"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./apps/api
    env_file:
      - path: ./apps/api/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://elsewhere:${POSTGRES_PASSWORD:-change-me-local-only}@db:5432/elsewhere
      SECURITY_NOTIFICATION_WORKER_IN_PROCESS: "false"
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
  notification-worker:
    build: ./apps/api
    env_file:
      - path: ./apps/api/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://elsewhere:${POSTGRES_PASSWORD:-change-me-local-only}@db:5432/elsewhere
    command: ["python", "scripts/process_security_notifications.py", "--loop", "--interval-seconds", "15"]
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
  web:
    build: ./apps/web
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    ports: ["5173:5173"]
    depends_on: [api]
volumes:
  pgdata:
